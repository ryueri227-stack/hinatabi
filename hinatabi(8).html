<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>ひなたび - 日向坂46 ポスターコレクション</title><link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"><style>:root{--sky:#8ed8ee;--deep:#276b83;--cream:#fffdf7;--ink:#28434c;--line:#d8e8ed;--gold:#f0b83f}*{box-sizing:border-box}body{margin:0;background:#eaf8fb;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans JP",sans-serif;color:var(--ink)}.app{width:min(1180px,100%);min-height:100vh;margin:auto;background:var(--cream);box-shadow:0 0 30px #9bc7d044}header{padding:22px 24px 18px;background:linear-gradient(150deg,#b8eff8,#72cce5);border-radius:0 0 28px 28px}.brand{display:flex;align-items:center;gap:10px}.sun{font-size:28px}.title{font-size:24px;font-weight:900}.sub{font-size:11px;font-weight:700;opacity:.75;margin-left:38px}.content{padding:18px 22px 92px}.hero,.store,.detailHero,.collect{background:#fff;border:1px solid var(--line);border-radius:20px;padding:16px;box-shadow:0 6px 18px #4b9eb51a}.count{font-size:34px;font-weight:900;color:var(--deep)}.count span{font-size:14px;color:#75909a}.bar{height:9px;background:#e7f1f3;border-radius:99px;overflow:hidden;margin-top:10px}.bar i{display:block;height:100%;background:linear-gradient(90deg,#74cfe7,#4caecb);width:0}.quick{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:14px}.q,.primary,.secondary,.back{border-radius:15px;cursor:pointer}.q{border:1px solid var(--line);background:#fff;padding:15px;text-align:left}.q b,.q small{display:block}.q small,.store small,.detailHero p,.collect small{color:#78919a;font-size:11px}.section{display:flex;justify-content:space-between;align-items:center;margin:22px 2px 10px}.section button{border:0;background:none;color:#38839a;font-weight:800}.recent{display:flex;gap:10px;overflow:auto}.card{min-width:155px;border:1px solid var(--line);border-radius:18px;padding:14px;background:#fff}.mystery{height:70px;border-radius:13px;background:#e5f7fb;display:flex;align-items:center;justify-content:center;font-size:28px}.page{display:none}.page.active{display:block}.topbar{display:flex;align-items:center;gap:12px;margin-bottom:14px}.topbar h2{margin:0;font-size:20px}.back{width:38px;height:38px;border:1px solid var(--line);background:#fff;font-size:20px}.mapWrap{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:16px}.map{height:620px;border-radius:22px;overflow:hidden;border:1px solid var(--line)}.storelist{display:grid;gap:9px;max-height:620px;overflow:auto}.store{display:flex;justify-content:space-between;align-items:center;cursor:pointer;padding:13px}.store b{font-size:12px}.badge{font-size:10px;font-weight:800;padding:6px 8px;border-radius:99px;background:#edf7f9;color:#4e8795;white-space:nowrap}.badge.done{background:#fff4d7;color:#ad7b13}.detailHero{text-align:center}.bigMystery{height:210px;border-radius:18px;background:radial-gradient(circle,#f7ffff,#d8f1f5);display:flex;align-items:center;justify-content:center;font-size:62px;color:#75aab7}.primary{width:100%;margin-top:14px;border:0;padding:14px;background:#3c91a9;color:#fff;font-weight:900}.secondary{width:100%;margin-top:9px;border:1px solid var(--line);padding:12px;background:#fff;font-weight:800;color:#4c7782}.donebox{background:#fff8e5;border:1px solid #f2dfab;border-radius:18px;padding:16px;margin-top:12px}.collection{display:grid;grid-template-columns:1fr 1fr;gap:12px}.collect{padding:11px}.collect .photo{height:135px;border-radius:13px;background:#edf9fb;display:flex;align-items:center;justify-content:center;font-size:38px;overflow:hidden}.collect b{display:block;margin-top:9px;font-size:12px}.empty{grid-column:1/-1;text-align:center;padding:35px 15px;color:#7f979e;border:1px dashed #cbdfe4;border-radius:18px}nav{position:fixed;bottom:0;width:min(1180px,100%);height:72px;background:#ffffffee;border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(3,1fr);backdrop-filter:blur(10px);z-index:20}.navbtn{border:0;background:none;color:#78929b;font-weight:800;font-size:11px}.navbtn strong{display:block;font-size:22px}.navbtn.active{color:#2f8299}.search{width:100%;padding:12px;border:1px solid var(--line);border-radius:13px;background:#fff;margin-top:10px}.address{font-size:11px;color:#657f88;line-height:1.5;margin-top:6px}.maplink{display:inline-block;margin-top:8px;font-size:11px;color:#277c95;font-weight:800;text-decoration:none}.modal{position:fixed;inset:0;background:#18333b66;display:none;align-items:flex-end;justify-content:center;z-index:30}.modal.show{display:flex}.sheet{width:min(560px,100%);background:var(--cream);border-radius:26px 26px 0 0;padding:20px}.sheet select,.sheet input{width:100%;padding:13px;border:1px solid var(--line);border-radius:13px;margin:8px 0;font-size:16px}.row{display:flex;gap:9px}.row button{flex:1}.toast{position:fixed;left:50%;bottom:86px;transform:translateX(-50%);background:#28434c;color:#fff;padding:11px 16px;border-radius:99px;font-size:12px;font-weight:800;display:none;z-index:50}.toast.show{display:block}@media(max-width:760px){body{background:var(--cream)}.app{box-shadow:none}.content{padding:14px 12px 92px}header{padding:calc(16px + env(safe-area-inset-top)) 16px 14px;border-radius:0 0 22px 22px}.title{font-size:21px}.mapWrap{display:block}.map{height:calc(100dvh - 285px);min-height:390px;max-height:560px;border-radius:18px}.storelist{max-height:300px;margin-top:10px}.mapWrap aside>div:first-child{padding:12px}.collection{gap:9px}.collect .photo{height:145px}nav{height:calc(66px + env(safe-area-inset-bottom));padding-bottom:env(safe-area-inset-bottom)}.navbtn{font-size:10px}.navbtn strong{font-size:20px}.sheet{padding-bottom:calc(22px + env(safe-area-inset-bottom))}}@media(max-width:390px){.map{min-height:360px}.collect .photo{height:130px}}</style></head><body><div class="app"><header><div class="brand"><div class="sun">☀️</div><div class="title">ひなたび</div></div><div class="sub">日向坂46 ポスターコレクション</div></header><main class="content"><section id="home" class="page active"><div class="hero"><b>ポスター発見数</b><div class="count"><span id="homeCount">0</span> <span>/ 26 市町村</span></div><div class="bar"><i id="homeBar"></i></div></div><div class="quick"><button class="q" onclick="showPage('map')"><b>🗺️ MAP</b><small>26市町村の設置場所を見る</small></button><button class="q" onclick="showPage('collection')"><b>📖 コレクション</b><small>発見したポスターを見る</small></button></div><div class="section"><h3>最近の発見</h3><button onclick="showPage('collection')">すべて見る →</button></div><div id="recent" class="recent"></div></section><section id="map" class="page"><div class="topbar"><button class="back" onclick="showPage('home')">‹</button><div><h2>MAP</h2><div style="font-size:11px;color:#78919a;font-weight:700">宮崎県26市町村のポスター設置場所</div></div></div><div class="mapWrap"><div><div class="map" id="mapArea"></div></div><aside><div class="hero"><b>📍 設置場所一覧</b><div style="font-size:11px;color:#78919a;margin-top:3px">住所から地図上の位置を取得します</div><input id="search" class="search" placeholder="市町村・場所名を検索" oninput="renderStores()"></div><div class="storelist" id="storeList"></div></aside></div></section><section id="detail" class="page"><div class="topbar"><button class="back" onclick="showPage('map')">‹</button><h2 id="detailTitle">設置場所</h2></div><div id="detailBody"></div></section><section id="collection" class="page"><div class="topbar"><button class="back" onclick="showPage('home')">‹</button><h2>コレクション</h2></div><div class="hero" style="margin-bottom:14px"><b>発見コンプリート率</b><div class="count"><span id="colCount">0</span><span> / 26</span></div><div class="bar"><i id="colBar"></i></div></div><div id="collectionGrid" class="collection"></div></section></main><nav><button id="navHome" class="navbtn active" onclick="showPage('home')"><strong>☀️</strong>ホーム</button><button id="navMap" class="navbtn" onclick="showPage('map')"><strong>🗺️</strong>MAP</button><button id="navCollection" class="navbtn" onclick="showPage('collection')"><strong>📖</strong>コレクション</button></nav></div><div id="modal" class="modal"><div class="sheet"><h3>🎉 ポスターを発見！</h3><p id="modalStore"></p><select id="memberInput"></select><input id="photoInput" type="file" accept="image/*"><div class="row"><button class="secondary" onclick="closeModal()">キャンセル</button><button class="primary" onclick="saveDiscovery()">コレクションに追加</button></div></div></div><div id="toast" class="toast"></div><script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script><script>
const members=['石塚 瑶季','大田 美月','大野 愛実','片山 紗希','金村 美玖','上村 ひなの','蔵盛 妃那乃','小坂 菜緒','小西 夏菜実','坂井 新奈','佐藤 優羽','清水 理央','下田 衣珠季','正源司 陽子','高井 俐香','髙橋 未来虹','竹内 希来里','鶴崎 仁香','平尾 帆夏','平岡 海月','藤嶌 果歩','松尾 桜','宮地 すみれ','森本 茉莉','山口 陽世','山下 葉留花','渡辺 莉奈'];
const places=[
['宮崎市','宮崎市観光案内所','宮崎市錦町1-8 JR宮崎駅構内'],['都城市','道の駅 都城NiQLL（都城市観光協会）','都城市都北町5225-1'],['延岡市','道の駅北方よっちみろ屋','延岡市北方町早日渡巳175-1'],['日南市','日南市観光協会','日南市園田二丁目1-1'],['小林市','道の駅ゆ～ぱるのじり','小林市野尻町三ケ野山4347-1'],['日向市','馬ヶ背茶屋・馬ヶ背観光案内所','日向市細島1-1'],['串間市','都井岬観光交流館PAKALAPAKA','串間市大字大納42番地3'],['西都市','西都原ガイダンスセンターこのはな館','西都市三宅4941-1'],['えびの市','アウトドアステーションえびの','えびの市大字永山1006-1'],['三股町','三股町物産館よかもんや','北諸県郡三股町樺山4421-22'],['高原町','皇子原公園','高原町大字蒲牟田3-251'],['国富町','国富町役場','国富町大字本庄4800番地'],['綾町','綾ほんものセンター','東諸県郡綾町大字南俣515番地'],['高鍋町','高鍋駅','児湯郡高鍋町大字蚊口浦5854番地1'],['新富町','新富町農畜産物直売所 ルーピン','児湯郡新富町三納代889'],['西米良村','川の駅「百菜屋」','児湯郡西米良村大字村所208-1'],['木城町','木城温泉館「湯らら」','児湯郡木城町大字高城1403-1'],['川南町','かわみなみPLATZ','児湯郡川南町大字川南1170-542'],['都農町','都農町役場','児湯郡都農町大字川北4874番地2'],['門川町','門川町観光協会','門川町大字門川尾末9246-2 門川駅内'],['諸塚村','諸塚村観光協会','東臼杵郡諸塚村3068番地'],['椎葉村','椎葉村観光協会','東臼杵郡椎葉村大字下福良1826番地108'],['美郷町','春夏秋冬いっつもや','東臼杵郡美郷町南郷神門925'],['高千穂町','道の駅高千穂','西臼杵郡高千穂町大字三田井1296-5'],['日之影町','道の駅 青雲橋','西臼杵郡日之影町大字七折8705-12'],['五ヶ瀬町','五ヶ瀬ワイナリー','西臼杵郡五ヶ瀬町桑野内4847-1']];
let data=JSON.parse(localStorage.getItem('hinatabiData')||'{}'),selected=-1,map=null,markers=[],coords=JSON.parse(localStorage.getItem('hinatabiCoords')||'{}');
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const count=()=>Object.keys(data).length;
function updateStats(){let c=count(),p=c/26*100;homeCount.textContent=c;colCount.textContent=c;homeBar.style.width=p+'%';colBar.style.width=p+'%'}
function showPage(id){document.querySelectorAll('.page').forEach(x=>x.classList.remove('active'));document.getElementById(id).classList.add('active');['home','map','collection'].forEach(n=>document.getElementById('nav'+n[0].toUpperCase()+n.slice(1)).classList.toggle('active',n===id));if(id==='map'){setTimeout(()=>{initMap();renderStores();map.invalidateSize()},50)}if(id==='collection')renderCollection();if(id==='home')renderRecent();scrollTo(0,0)}
function renderRecent(){let a=Object.entries(data).sort((x,y)=>new Date(y[1].date)-new Date(x[1].date)).slice(0,5);recent.innerHTML=a.length?a.map(([i,v])=>`<div class="card"><div class="mystery">☀️</div><b>${esc(v.member)}</b><small>${esc(places[i][0])}・${esc(places[i][1])}</small></div>`).join(''):'<div style="color:#80979d;font-size:12px;padding:10px">まだ発見がありません。MAPから旅を始めよう！☀️</div>'}
function initMap(){if(map)return;map=L.map('mapArea',{zoomControl:true,scrollWheelZoom:false}).setView([32.0,131.35],8);L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:18,attribution:'© OpenStreetMap contributors'}).addTo(map);geocodeAll()}
async function geocodeAll(){for(let i=0;i<places.length;i++){if(coords[i])continue;try{let q=encodeURIComponent(places[i][2]+', 宮崎県, Japan');let r=await fetch('https://nominatim.openstreetmap.org/search?format=json&limit=1&q='+q);let j=await r.json();if(j[0]){coords[i]=[+j[0].lat,+j[0].lon];localStorage.setItem('hinatabiCoords',JSON.stringify(coords));renderStores()}}catch(e){}await new Promise(r=>setTimeout(r,900))}if(Object.keys(coords).length){let b=Object.values(coords).map(x=>L.latLng(x));map.fitBounds(L.latLngBounds(b),{padding:[25,25],maxZoom:9})}}
function renderStores(){if(!map)return;let q=(document.getElementById('search')?.value||'').toLowerCase();storeList.innerHTML=places.map((p,i)=>({p,i})).filter(x=>(x.p[0]+x.p[1]+x.p[2]).toLowerCase().includes(q)).map(({p,i})=>`<div class="store" onclick="openDetail(${i})"><div><b>${esc(p[0])}：${esc(p[1])}</b><small>${data[i]?esc(data[i].member):'ポスター：？？？'}</small><div class="address">${esc(p[2])}</div></div><span class="badge ${data[i]?'done':''}">${data[i]?'発見済み':'未発見'}</span></div>`).join('');markers.forEach(m=>m.remove());markers=[];Object.entries(coords).forEach(([k,v])=>{let i=+k,p=places[i];let icon=L.divIcon({className:'',html:`<div style="width:28px;height:28px;border-radius:50% 50% 50% 0;transform:rotate(-45deg);background:#fff;border:3px solid ${data[i]?'#f0b83f':'#3c91a9'};display:flex;align-items:center;justify-content:center;font-weight:900;color:${data[i]?'#ad7b13':'#3c91a9'}"><span style="transform:rotate(45deg)">${data[i]?'★':'?'}</span></div>`,iconSize:[28,28],iconAnchor:[14,28]});let m=L.marker(v,{icon}).addTo(map).bindPopup(`<b>${esc(p[0])}</b><br>${esc(p[1])}<br>${esc(p[2])}<br><button onclick="openDetail(${i})" style="margin-top:6px;border:0;border-radius:8px;padding:6px 9px;background:#3c91a9;color:white;font-weight:700">詳細を見る</button>`);markers.push(m)})}
function openDetail(i){selected=i;let p=places[i],v=data[i];detailTitle.textContent=p[0]+'・'+p[1];detailBody.innerHTML=`<div class="detailHero">${v?.photo?`<img src="${v.photo}" style="width:100%;height:210px;object-fit:cover;border-radius:18px">`:'<div class="bigMystery">？？？</div>'}<h3>${v?esc(v.member):'ポスターはまだ未発見'}</h3><p>${v?'発見日：'+new Date(v.date).toLocaleDateString('ja-JP'):'実際に現地へ行って、誰のポスターか確認しよう！'}</p><div class="address">📍 ${esc(p[2])}</div><a class="maplink" target="_blank" href="https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(p[2]+' 宮崎県')}">Googleマップで場所を開く ↗</a></div>${v?`<div class="donebox"><b>✓ 発見済み</b><div style="font-size:22px;font-weight:900;margin-top:5px">${esc(v.member)}</div></div><button class="secondary" onclick="deleteDiscovery(${i})">記録を削除する</button>`:`<button class="primary" onclick="openModal(${i})">🎉 ポスターを発見した！</button>`}`;showPage('detail')}
function populateMembers(){memberInput.innerHTML='<option value="">メンバーを選択してください</option>'+members.map(m=>`<option>${esc(m)}</option>`).join('')};function openModal(i){selected=i;modalStore.textContent=places[i][0]+'：'+places[i][1];memberInput.value='';photoInput.value='';modal.classList.add('show')};function closeModal(){modal.classList.remove('show')}
function saveDiscovery(){let m=memberInput.value;if(!m){alert('メンバーを選択してください');return}let f=photoInput.files[0],save=(photo='')=>{data[selected]={member:m,date:new Date().toISOString(),photo};localStorage.setItem('hinatabiData',JSON.stringify(data));closeModal();updateStats();renderRecent();renderCollection();openDetail(selected);toast('コレクションに追加しました！☀️')};if(f){let r=new FileReader();r.onload=()=>save(r.result);r.readAsDataURL(f)}else save()}
function deleteDiscovery(i){if(confirm('この記録を削除しますか？')){delete data[i];localStorage.setItem('hinatabiData',JSON.stringify(data));updateStats();renderStores();openDetail(i);toast('記録を削除しました')}}function renderCollection(){let a=Object.entries(data).sort((x,y)=>x[0]-y[0]);collectionGrid.innerHTML=a.length?a.map(([i,v])=>`<div class="collect"><div class="photo">${v.photo?`<img src="${v.photo}" style="width:100%;height:100%;object-fit:cover">`:'☀️'}</div><b>${esc(v.member)}</b><small>${esc(places[i][0])}・${esc(places[i][1])}<br>📅 ${new Date(v.date).toLocaleDateString('ja-JP')}</small></div>`).join(''):'<div class="empty">まだコレクションは空っぽです。<br>26市町村を巡ってポスターを発見しよう！☀️</div>'};function toast(t){let x=document.getElementById('toast');x.textContent=t;x.classList.add('show');setTimeout(()=>x.classList.remove('show'),1800)}populateMembers();updateStats();renderRecent();
</script></body></html>
