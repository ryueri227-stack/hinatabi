<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIINfQ3D8bF2wR2Q4R3v7g3m4Qn9QwYj0M0=" crossorigin=""/>
<style>
:root{--sky:#8ed8ee;--deep:#276b83;--cream:#fffdf7;--ink:#28434c;--line:#d8e8ed;--accent:#ffcc5c}
*{box-sizing:border-box} body{margin:0;background:#eaf8fb;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans JP",sans-serif;color:var(--ink)}
.app{width:min(1180px,100vw);min-height:100vh;margin:auto;background:var(--cream);box-shadow:0 0 30px #9bc7d044;position:relative;overflow:hidden}
header{padding:22px 24px 18px;background:linear-gradient(150deg,#b8eff8,#72cce5);border-radius:0 0 28px 28px}.brand{display:flex;align-items:center;gap:10px}.sun{font-size:28px}.title{font-size:24px;font-weight:900;letter-spacing:.04em}.sub{font-size:11px;font-weight:700;opacity:.75;margin-left:38px;margin-top:2px}
.content{padding:18px 22px 92px}.hero{background:white;border:1px solid var(--line);border-radius:22px;padding:18px;box-shadow:0 8px 20px #4b9eb51a}.hero h2{margin:0 0 5px;font-size:15px}.count{font-size:34px;font-weight:900;color:var(--deep)}.count span{font-size:14px;color:#75909a}.bar{height:9px;background:#e7f1f3;border-radius:99px;overflow:hidden;margin-top:10px}.bar i{display:block;height:100%;background:linear-gradient(90deg,#74cfe7,#4caecb);width:0%}

.page{display:none}.page.active{display:block}.topbar{display:flex;align-items:center;gap:12px;margin-bottom:14px}.back{border:1px solid var(--line);background:white;border-radius:12px;width:38px;height:38px;font-size:18px;cursor:pointer}.topbar h2{margin:0;font-size:20px}.search{width:100%;padding:12px 14px;border:1px solid var(--line);border-radius:14px;background:white;outline:none;margin-bottom:12px}.mapWrap{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:16px;align-items:start}.map{height:620px;border-radius:22px;position:relative;overflow:hidden;background:#dceff3;border:1px solid var(--line);z-index:1}.map .leaflet-control-zoom{margin-top:12px}.map .leaflet-control-attribution{font-size:9px}.leaflet-container{font-family:inherit}.leaflet-control-attribution{font-size:8px}.leaflet-popup-content{font-family:inherit;font-size:12px}.leaflet-popup-content-wrapper{border-radius:14px}.map .pin{display:flex;align-items:center;justify-content:center;width:30px;height:30px;border-radius:50% 50% 50% 0;transform:rotate(-45deg);background:#fff;border:3px solid #3c91a9;box-shadow:0 4px 10px #276b8333;cursor:pointer}.map .pin span{transform:rotate(45deg);font-size:12px}.map .pin.done{border-color:#f0b83f}.map .pin.done span{color:#ad7b13}.legend{position:absolute;left:12px;bottom:12px;z-index:500;background:#ffffffeb;border-radius:12px;padding:8px 10px;font-size:10px;backdrop-filter:blur(4px);box-shadow:0 2px 8px #28434c22}
.storelist{margin-top:0;display:grid;gap:9px;max-height:620px;overflow:auto;padding-right:3px}.store{border:1px solid var(--line);background:white;border-radius:16px;padding:13px;display:flex;justify-content:space-between;align-items:center;cursor:pointer}.store b{font-size:12px}.store small{display:block;color:#849ba2;margin-top:3px}.badge{font-size:10px;font-weight:800;padding:6px 8px;border-radius:99px;background:#edf7f9;color:#4e8795}.badge.done{background:#fff4d7;color:#ad7b13}
.detailHero{background:linear-gradient(150deg,#e9f9fc,#fff);border:1px solid var(--line);border-radius:22px;padding:20px;text-align:center}.bigMystery{height:210px;border-radius:18px;background:radial-gradient(circle,#f7ffff,#d8f1f5);display:flex;align-items:center;justify-content:center;font-size:62px;color:#75aab7}.detailHero h3{margin:14px 0 4px;font-size:17px}.detailHero p{margin:0;color:#7a9198;font-size:12px}.primary{width:100%;margin-top:14px;border:0;border-radius:15px;padding:14px;background:#3c91a9;color:white;font-weight:900;font-size:14px;cursor:pointer}.secondary{width:100%;margin-top:9px;border:1px solid var(--line);border-radius:15px;padding:12px;background:white;font-weight:800;color:#4c7782;cursor:pointer}.donebox{background:#fff8e5;border:1px solid #f2dfab;border-radius:18px;padding:16px;margin-top:12px}.donebox b{color:#9a7117}.donebox .name{font-size:22px;font-weight:900;margin-top:5px}
.collection{display:grid;grid-template-columns:1fr 1fr;gap:12px}.collect{border:1px solid var(--line);background:white;border-radius:18px;padding:11px}.collect .photo{height:135px;border-radius:13px;background:linear-gradient(145deg,#edf9fb,#d5edf2);display:flex;align-items:center;justify-content:center;font-size:38px}.collect b{display:block;margin-top:9px;font-size:12px}.collect small{color:#80979d;font-size:10px}.empty{grid-column:1/-1;text-align:center;padding:35px 15px;color:#7f979e;border:1px dashed #cbdfe4;border-radius:18px}
nav{position:fixed;bottom:0;width:min(1180px,100vw);height:72px;background:#ffffffee;border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(3,1fr);backdrop-filter:blur(10px);z-index:20}.navbtn{border:0;background:none;color:#78929b;font-weight:800;font-size:11px;cursor:pointer}.navbtn strong{display:block;font-size:22px;margin-bottom:3px}.navbtn.active{color:#2f8299}
.modal{position:fixed;inset:0;background:#18333b66;display:none;align-items:flex-end;justify-content:center;z-index:30}.modal.show{display:flex}.sheet{width:min(560px,100vw);background:var(--cream);border-radius:26px 26px 0 0;padding:20px 18px 28px}.sheet h3{margin:0 0 6px}.sheet p{margin:0 0 14px;font-size:12px;color:#78919a}.sheet input{width:100%;padding:13px;border:1px solid var(--line);border-radius:13px;margin-bottom:10px}.row{display:flex;gap:9px}.row button{flex:1}.close{background:#fff;border:1px solid var(--line);color:#597781}.save{background:#3c91a9;color:#fff;border:0}
.toast{position:fixed;left:50%;bottom:86px;transform:translateX(-50%) translateY(20px);background:#28434c;color:white;padding:11px 16px;border-radius:99px;font-size:12px;font-weight:800;opacity:0;pointer-events:none;transition:.25s;z-index:50}.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
@media(max-width:760px){.app{width:100vw}.mapWrap{grid-template-columns:1fr}.map{height:500px}.storelist{max-height:none}.content{padding:18px 14px 92px}}
@media(min-width:761px){header .sub{margin-left:38px}.page#map{max-width:1160px;margin:auto}}

<body>
<div class="app">
<header><div class="brand"><div class="sun">☀️</div><div class="title">ひなたび</div></div><div class="sub">日向坂46 ポスターコレクション</div></header>
<main class="content">
<section id="home" class="page active">
<div class="hero"><h2>ポスター発見数</h2><div class="count"><span id="homeCount">0</span> <span>/ 25 店舗</span></div><div class="bar"><i id="homeBar"></i></div></div>
<div class="quick"><button class="q" onclick="showPage('map')"><b>🗺️ MAP</b><small>ポスターを探しに行く</small></button><button class="q" onclick="showPage('collection')"><b>📖 コレクション</b><small>発見したポスターを見る</small></button></div>
<div class="section"><h3>最近の発見</h3><button onclick="showPage('collection')">すべて見る →</button></div><div id="recent" class="recent"></div>
</section>
<section id="map" class="page"><div class="topbar"><button class="back" onclick="showPage('home')">‹</button><div><h2>MAP</h2><div style="font-size:11px;color:#78919a;font-weight:700">宮崎県のポスター設置店舗</div></div></div><div class="mapWrap"><div><div class="map" id="mapArea"><div class="legend"><span style="color:#3c91a9">●</span> 未発見　 <span style="color:#f0b83f">●</span> 発見済み</div></div></div><aside><div style="background:white;border:1px solid var(--line);border-radius:20px;padding:14px;margin-bottom:10px"><div style="font-weight:900;font-size:15px">📍 店舗一覧</div><div style="font-size:11px;color:#78919a;margin-top:3px">25店舗から探しに行こう</div><input id="search" class="search" style="margin:12px 0 0" placeholder="店舗名を検索" oninput="renderStores()"></div><div class="storelist" id="storeList"></div></aside></div></section>
<section id="detail" class="page"><div class="topbar"><button class="back" onclick="showPage('map')">‹</button><h2 id="detailTitle">店舗詳細</h2></div><div id="detailBody"></div></section>
<section id="collection" class="page"><div class="topbar"><button class="back" onclick="showPage('home')">‹</button><h2>コレクション</h2></div><div class="hero" style="margin-bottom:14px"><h2>発見コンプリート率</h2><div class="count"><span id="colCount">0</span><span> / 25</span></div><div class="bar"><i id="colBar"></i></div></div><div id="collectionGrid" class="collection"></div></section>
</main>
<nav><button id="navHome" class="navbtn active" onclick="showPage('home')"><strong>☀️</strong>ホーム</button><button id="navMap" class="navbtn" onclick="showPage('map')"><strong>🗺️</strong>MAP</button><button id="navCollection" class="navbtn" onclick="showPage('collection')"><strong>📖</strong>コレクション</button></nav>
</div>
<div id="modal" class="modal"><div class="sheet"><h3>🎉 ポスターを発見！</h3><p id="modalStore"></p><select id="memberInput" aria-label="メンバーを選択"><option value="">メンバーを選択してください</option></select><input id="photoInput" type="file" accept="image/*"><div class="row"><button class="secondary close" onclick="closeModal()">キャンセル</button><button class="primary save" onclick="saveDiscovery()">コレクションに追加</button></div></div></div>
<div id="toast" class="toast"></div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
<script>
const members=['石塚 瑶季','大田 美月','大野 愛実','片山 紗希','金村 美玖','上村 ひなの','蔵盛 妃那乃','小坂 菜緒','小西 夏菜実','坂井 新奈','佐藤 優羽','清水 理央','下田 衣珠季','正源司 陽子','高井 俐香','髙橋 未来虹','竹内 希来里','鶴崎 仁香','平尾 帆夏','平岡 海月','藤嶌 果歩','松尾 桜','宮地 すみれ','森本 茉莉','山口 陽世','山下 葉留花','渡辺 莉奈'];
const addresses=[
'宮崎県日向市日知屋古田町61-1','宮崎県都城市栄町4672-5','宮崎県宮崎市清武町正手2-37-8','宮崎県宮崎市柳丸町150','宮崎県延岡市旭町2-2-1','宮崎県延岡市幸町2-128','宮崎県宮崎市花山手東1-20-2','宮崎県宮崎市大塚町樋ノ口1931','宮崎県宮崎市吉村町長田甲2359','宮崎県串間市寺里2-7-1','宮崎県宮崎市江平西2-1-47','宮崎県宮崎市佐土原町下那珂2642','宮崎県児湯郡高鍋町北高鍋3234-1','宮崎県東諸県郡国富町木脇5199-5','宮崎県西都市妻字平田1654-1','宮崎県小林市細野1900-1','宮崎県小林市水流迫231-3','宮崎県都城市吉尾町826-1','宮崎県宮崎市東大淀2-3-35','宮崎県都城市鷹尾3-4-7','宮崎県日南市星倉4437-1','宮崎県都城市前田町7-27','宮崎県日南市中央通1-11-9','宮崎県東臼杵郡門川町上町6-43','宮崎県宮崎市大字田吉城ノ下5508-1'
];
// 住所・地図情報を基にした店舗位置。検索で確認できた座標を優先し、未確認分は起動時に住所から補正します。
const coords=[
[32.424494,131.652424],
[31.7351105,131.0799322],
[31.8618002,131.3872626],
[31.927781,131.436657],
[32.572218,131.670132],
[32.5883286,131.6708894],
[31.902508,131.405908],
[31.918403,131.398975],
[31.9122957,131.4471706],
[31.464539,131.228306],
[31.9284473,131.4262114],
[32.008416,131.473779],
[32.1255776,131.5210446],
[31.990646,131.323535],
[32.1045307,131.3994006],
[31.9925367,130.9775987],
[31.9830639,131.0011997],
[31.7248,131.0755],
[31.8938589,131.4197369],
[31.7258,131.0435],
[31.6150692,131.371909],
[31.7297988,131.0678537],
[31.6006742,131.3826466],
[32.468656,131.648358],
[31.8665543,131.4320949]
];
const stores=[
'ドコモショップイオンタウン日向店','ドコモショップイオンモール都城駅前店','ドコモショップベアーズモール清武店','ドコモショップフェニックスガーデンうきのじょう店','ドコモショップイオン延岡SC店','ドコモショップ延岡駅前店','ドコモショップ花山手バイパス店','ドコモショップ宮崎大塚店','ドコモショップ宮崎東店','ドコモショップ串間店','ドコモショップ江平店','ドコモショップ佐土原店','ドコモショップ高鍋店','ドコモショップ国富店','ドコモショップ西都店','ドコモショップ小林駅前店','ドコモショップ小林店','ドコモショップ都城吉尾店','ドコモショップ大淀店','ドコモショップ鷹尾店','ドコモショップ日南星倉店','ドコモショップ都城中央店','ドコモショップ日南駅前店','ドコモショップ門川店','ドコモショップ本郷店'];
let data=JSON.parse(localStorage.getItem('hinatabiData')||'{}'); let selected=-1;
const esc=s=>s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function count(){return Object.keys(data).length}
function updateStats(){let c=count(),p=c/25*100; document.getElementById('homeCount').textContent=c;document.getElementById('colCount').textContent=c;document.getElementById('homeBar').style.width=p+'%';document.getElementById('colBar').style.width=p+'%';}
function showPage(id){document.querySelectorAll('.page').forEach(x=>x.classList.remove('active'));document.getElementById(id).classList.add('active');['home','map','collection'].forEach(n=>document.getElementById('nav'+n[0].toUpperCase()+n.slice(1)).classList.toggle('active',n===id));if(id==='map')renderStores();if(id==='collection')renderCollection();if(id==='home')renderRecent();window.scrollTo(0,0)}
function renderRecent(){let el=document.getElementById('recent');let arr=Object.entries(data).sort((a,b)=>new Date(b[1].date)-new Date(a[1].date)).slice(0,5);el.innerHTML=arr.length?arr.map(([i,v])=>`<div class="card"><div class="mystery">☀️</div><b>${esc(v.member)}</b><small>${esc(stores[i])}</small></div>`).join(''):'<div style="color:#80979d;font-size:12px;padding:10px">まだ発見がありません。まずはMAPから探しに行こう！☀️</div>'}
let leafletMap=null; let leafletPins=[];
function initMap(){
  if(leafletMap) return;
  leafletMap=L.map('mapArea',{zoomControl:true,scrollWheelZoom:false,attributionControl:true});
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:18,attribution:'&copy; OpenStreetMap contributors'}).addTo(leafletMap);
  const bounds=L.latLngBounds(coords);
  leafletMap.fitBounds(bounds,{padding:[28,28],maxZoom:9});
  // 初期表示を少し南側（宮崎県中心）へずらす
  leafletMap.panBy([0,-75],{animate:false});
  leafletMap.setMaxBounds([[30.75,130.35],[33.05,132.15]]);
  leafletMap.options.maxBoundsViscosity=0.85;
}
function geocodeStores(){
  // 25店舗の座標は固定値を使用。外部ジオコーディングで別県へずれることを防止。
  if(leafletMap){ renderStores(); leafletMap.fitBounds(L.latLngBounds(coords),{padding:[28,28],maxZoom:9}); leafletMap.panBy([0,-75],{animate:false}); }
}

function renderStores(){
  initMap();
  let q=(document.getElementById('search')?.value||'').toLowerCase();
  let list=document.getElementById('storeList');
  list.innerHTML=stores.map((s,i)=>({s,i})).filter(x=>x.s.toLowerCase().includes(q)).map(x=>`<div class="store" onclick="openDetail(${x.i})"><div><b>${x.s}</b><small>${data[x.i]?esc(data[x.i].member):'ポスター：？？？'}</small></div><span class="badge ${data[x.i]?'done':''}">${data[x.i]?'発見済み':'未発見'}</span></div>`).join('');
  leafletPins.forEach(p=>p.remove()); leafletPins=[];
  stores.forEach((s,i)=>{
    const [lat,lng]=coords[i];
    const icon=L.divIcon({className:'',html:`<button class="pin ${data[i]?'done':''}"><span>${data[i]?'★':'?'}</span></button>`,iconSize:[30,30],iconAnchor:[15,30],popupAnchor:[0,-30]});
    const marker=L.marker([lat,lng],{icon}).addTo(leafletMap);
    marker.bindPopup(`<b>${esc(s)}</b><br>${data[i]?esc(data[i].member):'ポスター：？？？'}<br><button onclick="openDetail(${i})" style="margin-top:6px;border:0;border-radius:8px;padding:6px 9px;background:#3c91a9;color:white;font-weight:700">店舗詳細</button>`);
    marker.on('click',()=>{}); leafletPins.push(marker);
  });
}
function openDetail(i){selected=i;document.getElementById('detailTitle').textContent=stores[i];let v=data[i];document.getElementById('detailBody').innerHTML=v?`<div class="detailHero">${v.photo?`<img src="${v.photo}" alt="ポスター写真" style="width:100%;height:210px;object-fit:cover;border-radius:18px">`:`<div class="bigMystery">📸</div>`}<h3>${esc(v.member)}</h3><p>発見日：${new Date(v.date).toLocaleDateString('ja-JP')}</p></div><div class="donebox"><b>✓ 発見済み</b><div class="name">${esc(v.member)}</div><div style="font-size:12px;color:#8a7b55;margin-top:7px">📅 発見日：${new Date(v.date).toLocaleDateString('ja-JP')}</div><div style="font-size:11px;color:#8a7b55;margin-top:5px">この店舗のポスターを記録しました</div></div><button class="secondary" onclick="deleteDiscovery(${i})">記録を削除する</button>`:`<div class="detailHero"><div class="bigMystery">？？？</div><h3>ポスターはまだ未発見</h3><p>実際に店舗へ行って、誰のポスターか確認しよう！</p></div><button class="primary" onclick="openModal(${i})">🎉 ポスターを発見した！</button>`;showPage('detail')}
function populateMembers(){const el=document.getElementById('memberInput');el.innerHTML='<option value="">メンバーを選択してください</option>'+members.map(m=>`<option value="${esc(m)}">${esc(m)}</option>`).join('')}
function openModal(i){selected=i;document.getElementById('modalStore').textContent=stores[i];document.getElementById('memberInput').value='';document.getElementById('photoInput').value='';document.getElementById('modal').classList.add('show')}
function closeModal(){document.getElementById('modal').classList.remove('show')}
function saveDiscovery(){let m=document.getElementById('memberInput').value.trim();if(!m){alert('メンバーを選択してください');return}const file=document.getElementById('photoInput').files[0];const save=(photo='')=>{data[selected]={member:m,date:new Date().toISOString(),photo};localStorage.setItem('hinatabiData',JSON.stringify(data));closeModal();updateStats();renderRecent();renderCollection();openDetail(selected);toast('コレクションに追加しました！☀️')};if(file){const r=new FileReader();r.onload=()=>save(r.result);r.readAsDataURL(file)}else save()}
function deleteDiscovery(i){if(confirm('この記録を削除しますか？')){delete data[i];localStorage.setItem('hinatabiData',JSON.stringify(data));updateStats();renderStores();openDetail(i);toast('記録を削除しました')}}
function renderCollection(){let el=document.getElementById('collectionGrid');let arr=Object.entries(data).sort((a,b)=>a[0]-b[0]);el.innerHTML=arr.length?arr.map(([i,v])=>`<div class="collect"><div class="photo">${v.photo?`<img src="${v.photo}" alt="ポスター写真" style="width:100%;height:100%;object-fit:cover;border-radius:13px">`:'☀️'}</div><b>${esc(v.member)}</b><small>${esc(stores[i])}<br>📅 ${new Date(v.date).toLocaleDateString('ja-JP')}</small></div>`).join(''):'<div class="empty">まだコレクションは空っぽです。<br>店舗を巡ってポスターを発見しよう！☀️</div>'}
function toast(t){let x=document.getElementById('toast');x.textContent=t;x.classList.add('show');setTimeout(()=>x.classList.remove('show'),1800)}
populateMembers();updateStats();renderRecent();
geocodeStores();
</script>
</body></html>
