<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#78d8ef">
<title>ひなたび｜HINATA × MIYAZAKI</title>
<style>
:root{--sky:#78d8ef;--pale:#dff8fd;--ink:#25434b;--muted:#76939b;--line:#e4f1f4;--ok:#35c6a1}
*{box-sizing:border-box}body{margin:0;background:linear-gradient(#dff8fd,#f6fcfd 230px);font-family:-apple-system,BlinkMacSystemFont,"Noto Sans JP","Yu Gothic",sans-serif;color:var(--ink)}
.app{max-width:520px;margin:auto;min-height:100vh;padding-bottom:90px}header{padding:22px 18px 12px;display:flex;justify-content:space-between;align-items:center}.brand{font-weight:900;font-size:21px}.brand small{display:block;font-size:10px;color:#4d9cac;margin-top:2px}header button{border:0;background:none;font-size:20px;color:#76939b}
main{padding:0 15px}.screen{display:none}.screen.active{display:block}.hero{background:linear-gradient(135deg,#8ce2f4,#53c5e1);color:#fff;border-radius:25px;padding:22px;box-shadow:0 12px 30px #53c5e130}.hero h1{margin:0;font-size:18px}.count{font-size:42px;font-weight:900;margin:8px 0}.bar{height:9px;background:#ffffff55;border-radius:99px;overflow:hidden}.fill{height:100%;background:#fff;width:0}.section{font-size:16px;font-weight:900;margin:22px 3px 11px}.card,.tile,.collection{background:#fff;border:1px solid var(--line);border-radius:18px;padding:14px;margin-bottom:10px}.tile,.collection{cursor:pointer}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.row{display:flex;align-items:center;gap:10px}.grow{flex:1}.muni{font-weight:900}.member{font-size:12px;color:var(--muted);margin-top:3px}.place{font-size:11px;color:#4d9cac;margin-top:6px;line-height:1.45}.badge{font-size:10px;font-weight:800;padding:5px 8px;border-radius:99px;background:var(--pale);color:#329bb3;white-space:nowrap}.badge.ok{background:#e4faf4;color:#1a9b79}
.detail{background:#fff;border:1px solid var(--line);border-radius:22px;padding:17px}.back{border:0;background:none;color:#329bb3;font-weight:900;padding:0 0 13px}.photo{width:100%;aspect-ratio:4/3;border-radius:17px;background:var(--pale);display:flex;align-items:center;justify-content:center;overflow:hidden;margin:12px 0;color:#7aa8b0;font-weight:800}.photo img{width:100%;height:100%;object-fit:cover}.btn{border:0;border-radius:13px;padding:12px 14px;font-weight:900;width:100%;margin-top:8px}.primary{background:var(--sky);color:#fff}.soft{background:var(--pale);color:#278fa7}textarea{width:100%;border:1px solid var(--line);border-radius:12px;padding:10px;font:inherit;margin-top:8px;min-height:80px;resize:vertical}
.collection-summary{grid-column:1/-1;background:linear-gradient(135deg,#8ce2f4,#53c5e1);color:#fff;border-radius:20px;padding:16px}.collection-summary strong{display:block;font-size:27px;margin-top:3px}.collection-img,.collection-lock{width:100%;aspect-ratio:1;border-radius:13px;display:block}.collection-img{object-fit:cover}.collection-lock{background:linear-gradient(145deg,#e9f9fc,#f8fdfe);display:grid;place-items:center;font-size:32px;color:#8dbec7}.collection-name{font-weight:900;font-size:13px;margin-top:8px}.collection-member{font-size:11px;color:var(--muted);margin-top:3px}.collection-status{font-size:10px;color:#4d9cac;margin-top:5px}.toast{position:fixed;z-index:3000;left:50%;bottom:86px;transform:translate(-50%,10px);background:#25434b;color:#fff;padding:11px 16px;border-radius:13px;font-size:13px;font-weight:800;opacity:0;pointer-events:none;transition:.2s;max-width:90%;text-align:center}.toast.show{opacity:1;transform:translate(-50%,0)}
nav{position:fixed;z-index:2000;bottom:10px;left:50%;transform:translateX(-50%);width:min(488px,calc(100% - 22px));background:#ffffffed;backdrop-filter:blur(12px);border:1px solid #dceff3;border-radius:21px;display:grid;grid-template-columns:repeat(4,1fr);padding:7px}nav button{border:0;background:none;padding:8px 2px;color:#78949a;font-weight:800;border-radius:13px;font-size:11px}nav button.active{background:var(--pale);color:#238fa8}
</style>
</head>
<body>
<div class="app">
<header><div class="brand">ひなたび<small>HINATA × MIYAZAKI</small></div><button aria-label="リセット" onclick="resetAll()">↻</button></header>
<main>
<section id="home" class="screen active"><div class="hero"><h1>宮崎26市町村 ポスター巡り</h1><div class="count"><span id="done">0</span> / 26</div><div id="rate">達成率 0%</div><div class="bar"><div class="fill" id="fill"></div></div></div><div class="section">最近の巡礼</div><div id="recent" class="card">まだ巡礼記録がありません。<br>最初の1枚を撮りに行こう！📸</div><div class="section">26市町村</div><div id="grid" class="grid"></div></section>
<section id="list" class="screen"><div class="section">📍 巡礼リスト</div><div id="listGrid"></div></section>
<section id="collectionScreen" class="screen"><div class="section">📸 ポスターコレクション</div><div id="collectionGrid" class="grid"></div></section>
<section id="detailScreen" class="screen"><div id="detail"></div></section>
</main>
<nav><button data-s="home" onclick="show('home')">🏠<br>ホーム</button><button data-s="list" onclick="show('list')">📍<br>巡礼</button><button data-s="map" onclick="location.href='map.html'">🗺️<br>マップ</button><button data-s="collectionScreen" onclick="show('collectionScreen')">📸<br>コレクション</button></nav>
</div>
<div id="toast" class="toast"></div>
<input id="photoInput" type="file" accept="image/*" hidden>
<script>
const data=[
['宮崎市','山下葉留花','宮崎市観光案内所'],['都城市','森本茉莉','道の駅 都城NiQLL（都城市観光協会）'],['延岡市','平岡海月','道の駅 北方よっちみろ屋'],['日南市','鶴崎仁香','日南市観光案内所'],['小林市','小西夏菜実','道の駅ゆ～ぱるのじり'],['日向市','藤嶌果歩','馬ヶ背茶屋・馬ヶ背観光案内所'],['串間市','上村ひなの','都井岬観光交流館PAKALAPAKA'],['西都市','坂井新奈','西都原ガイダンスセンターこのはな館'],['えびの市','大田美月','アウトドアステーションえびの'],['三股町','宮地すみれ','三股町物産館よかもんや'],['高原町','高井俐香','皇子原公園'],['国富町','蔵盛妃那乃','国富町役場'],['綾町','石塚瑶季','綾ほんものセンター'],['高鍋町','正源司陽子','高鍋駅'],['新富町','清水理央','新富町農畜産物直売所 ルーピン'],['西米良村','竹内希来里','川の駅「百菜屋」'],['木城町','金村美玖','木城温泉館「湯らら」'],['川南町','片山紗希','かわみなみPLATZ'],['都農町','髙橋未来虹','都農町役場'],['門川町','大野愛実','門川町観光協会（門川駅内）'],['諸塚村','渡辺莉奈','諸塚村観光協会'],['椎葉村','佐藤優羽','椎葉村観光協会'],['美郷町','松尾桜','春夏秋冬いっつもや'],['高千穂町','下田衣珠季','道の駅高千穂'],['日之影町','平尾帆夏','道の駅 青雲橋'],['五ヶ瀬町','小坂菜緒','五ヶ瀬ワイナリー']
];
let state=JSON.parse(localStorage.getItem('hinatabi_miyazaki')||'{}'),current=null,db=null,photoUrls={};
const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
function openDB(){return new Promise((resolve,reject)=>{const r=indexedDB.open('hinatabi_photos_v2',1);r.onupgradeneeded=()=>r.result.createObjectStore('photos');r.onsuccess=()=>{db=r.result;resolve(db)};r.onerror=()=>reject(r.error)})}
function putPhoto(i,file){return new Promise((resolve,reject)=>{const tx=db.transaction('photos','readwrite');tx.objectStore('photos').put(file,i);tx.oncomplete=resolve;tx.onerror=()=>reject(tx.error)})}
function getPhoto(i){return new Promise((resolve,reject)=>{const tx=db.transaction('photos','readonly');const r=tx.objectStore('photos').get(i);r.onsuccess=()=>resolve(r.result||null);r.onerror=()=>reject(r.error)})}
function deletePhoto(i){return new Promise((resolve,reject)=>{const tx=db.transaction('photos','readwrite');tx.objectStore('photos').delete(i);tx.oncomplete=resolve;tx.onerror=()=>reject(tx.error)})}
async function loadPhotoUrls(){for(const i of Object.keys(state)){if(state[i]?.photo){const file=await getPhoto(Number(i));if(file)photoUrls[i]=URL.createObjectURL(file);else{delete state[i].photo;localStorage.setItem('hinatabi_miyazaki',JSON.stringify(state))}}}render()}
function save(){localStorage.setItem('hinatabi_miyazaki',JSON.stringify(state));render()}
function show(id){document.querySelectorAll('.screen').forEach(x=>x.classList.remove('active'));document.getElementById(id).classList.add('active');document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('active',b.dataset.s===id));render();scrollTo(0,0)}
function render(){const done=data.filter((_,i)=>state[i]?.visited).length;const collected=data.filter((_,i)=>state[i]?.photo).length;document.getElementById('done').textContent=done;document.getElementById('rate').textContent=done===26?'🎉 ひなたび COMPLETE！':`達成率 ${Math.round(done/26*1000)/10}%`;document.getElementById('fill').style.width=done/26*100+'%';
document.getElementById('grid').innerHTML=data.map((m,i)=>`<div class="tile" onclick="openDetail(${i})"><div class="row"><div class="grow"><div class="muni">${m[0]}</div><div class="member">${m[1]}</div></div><span class="badge ${state[i]?.visited?'ok':''}">${state[i]?.visited?'✓ 済':'未訪問'}</span></div><div class="place">📍 ${m[2]}</div></div>`).join('');
document.getElementById('listGrid').innerHTML=data.map((m,i)=>`<div class="card" onclick="openDetail(${i})"><div class="row"><div class="grow"><div class="muni">${i+1}. ${m[0]}</div><div class="member">${m[1]}</div><div class="place">📍 ${m[2]}</div></div><span class="badge ${state[i]?.visited?'ok':''}">${state[i]?.visited?'✓ 済':'未訪問'}</span></div></div>`).join('');
const recent=Object.keys(state).filter(i=>state[i]?.visited).sort((a,b)=>(state[b].updated||'').localeCompare(state[a].updated||'')).slice(0,3);document.getElementById('recent').innerHTML=recent.length?recent.map(i=>`<div onclick="openDetail(${i})"><b>${data[i][0]}</b>　${state[i].date||''}</div>`).join('<hr>'):'まだ巡礼記録がありません。<br>最初の1枚を撮りに行こう！📸';
document.getElementById('collectionGrid').innerHTML=`<div class="collection-summary"><div>📸 ポスターコレクション</div><strong>${collected} / 26</strong><div style="font-size:11px">写真を集めてコンプリートしよう！</div></div>`+data.map((m,i)=>{const v=state[i]||{};return `<div class="collection" onclick="openDetail(${i})">${v.photo&&photoUrls[i]?`<img class="collection-img" src="${photoUrls[i]}" alt="${esc(m[0])}のポスター">`:`<div class="collection-lock">📷</div>`}<div class="collection-name">${m[0]}</div><div class="collection-member">${m[1]}</div><div class="collection-status">${v.photo?'📸 発見済み':'📷 まだ撮影していません'}</div></div>`}).join('');}
async function openDetail(i){current=i;show('detailScreen');const m=data[i],v=state[i]||{};let src=photoUrls[i];if(v.photo&&!src){const f=await getPhoto(i);if(f){src=photoUrls[i]=URL.createObjectURL(f)}}document.getElementById('detail').innerHTML=`<button class="back" onclick="show('list')">← 巡礼リストに戻る</button><div class="detail"><div class="muni">${m[0]}</div><div class="member">👤 ${m[1]}</div><div class="place">📍 ${m[2]}</div><div class="photo">${src?`<img src="${src}" alt="${esc(m[0])}のポスター">`:'📷 ポスター写真を登録'}</div><button class="btn primary" onclick="document.getElementById('photoInput').click()">📸 写真を登録</button><button class="btn soft" onclick="toggleVisit()">${v.visited?'✓ 訪問済みを解除':'✓ 訪問済みにする'}</button><textarea id="memo" placeholder="メモ">${esc(v.memo||'')}</textarea><button class="btn soft" onclick="saveMemo()">メモを保存</button></div>`}
async function handlePhoto(file){if(!file||current===null)return;try{await putPhoto(current,file);const v=state[current]||{};v.photo=true;v.visited=true;v.updated=new Date().toISOString();v.date=new Date().toLocaleDateString('ja-JP');state[current]=v;save();if(photoUrls[current])URL.revokeObjectURL(photoUrls[current]);photoUrls[current]=URL.createObjectURL(file);await openDetail(current);toast('📸 写真を登録しました！');}catch(e){toast('写真の保存に失敗しました。もう一度お試しください。')}}
document.getElementById('photoInput').addEventListener('change',e=>{const f=e.target.files?.[0];e.target.value='';handlePhoto(f)});
function toggleVisit(){const v=state[current]||{};v.visited=!v.visited;v.updated=new Date().toISOString();v.date=v.visited?new Date().toLocaleDateString('ja-JP'):'';state[current]=v;save();openDetail(current)}
function saveMemo(){const v=state[current]||{};v.memo=document.getElementById('memo').value;state[current]=v;save();toast('メモを保存しました！')}
function toast(msg){const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');clearTimeout(window._toast);window._toast=setTimeout(()=>t.classList.remove('show'),1800)}
async function resetAll(){if(!confirm('巡礼記録・写真・メモをすべて削除します。よろしいですか？'))return;localStorage.removeItem('hinatabi_miyazaki');state={};for(let i=0;i<data.length;i++)await deletePhoto(i);Object.values(photoUrls).forEach(u=>URL.revokeObjectURL(u));photoUrls={};render();show('home')}
(async()=>{try{await openDB();await loadPhotoUrls();const q=new URLSearchParams(location.search);if(q.has('m')){const i=Number(q.get('m'));if(Number.isInteger(i)&&i>=0&&i<data.length)setTimeout(()=>openDetail(i),80)}}catch(e){render();toast('写真保存機能の初期化に失敗しました')}})();
</script>
</body>
</html>
