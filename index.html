<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#78d8ef"><title>ひなたび｜HINATA × MIYAZAKI</title><link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"><style>:root{--sky:#78d8ef;--pale:#dff8fd;--ink:#25434b;--muted:#76939b;--line:#e4f1f4;--ok:#35c6a1}*{box-sizing:border-box}body{margin:0;background:linear-gradient(#dff8fd,#f6fcfd 230px);font-family:-apple-system,BlinkMacSystemFont,"Noto Sans JP","Yu Gothic",sans-serif;color:var(--ink)}.app{max-width:520px;margin:auto;min-height:100vh;padding-bottom:86px}header{padding:25px 18px 14px;display:flex;justify-content:space-between;align-items:center}.brand{font-weight:900;font-size:21px}.brand small{display:block;font-size:10px;color:#4d9cac;margin-top:2px}main{padding:0 15px}.screen{display:none}.screen.active{display:block}.hero{background:linear-gradient(135deg,#8ce2f4,#53c5e1);color:white;border-radius:25px;padding:22px;box-shadow:0 12px 30px #53c5e130}.hero h1{margin:0;font-size:18px}.count{font-size:42px;font-weight:900;margin:8px 0}.bar{height:9px;background:#ffffff55;border-radius:99px;overflow:hidden}.fill{height:100%;background:white;width:0}.section{font-size:16px;font-weight:900;margin:24px 3px 11px}.card,.tile{background:white;border:1px solid var(--line);border-radius:18px;padding:14px;margin-bottom:10px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.tile{margin:0;cursor:pointer}.row{display:flex;align-items:center;gap:10px}.grow{flex:1}.muni{font-weight:900}.member{font-size:12px;color:var(--muted);margin-top:3px}.place{font-size:11px;color:#4d9cac;margin-top:6px}.badge{font-size:10px;font-weight:800;padding:5px 8px;border-radius:99px;background:var(--pale);color:#329bb3}.badge.ok{background:#e4faf4;color:#1a9b79}.map{height:500px;border-radius:22px;overflow:hidden;border:1px solid var(--line);box-shadow:0 6px 20px #2e93a410}.legend{font-size:11px;color:var(--muted);margin:9px 3px}.dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:4px;background:#78d8ef}.dot.done{background:#f39a55}.detail{background:white;border:1px solid var(--line);border-radius:22px;padding:17px}.back{border:0;background:none;color:#329bb3;font-weight:900;padding:0 0 13px}.photo{width:100%;aspect-ratio:4/3;border-radius:17px;background:var(--pale);display:flex;align-items:center;justify-content:center;overflow:hidden;margin:12px 0}.photo img{width:100%;height:100%;object-fit:cover}.btn{border:0;border-radius:13px;padding:12px 14px;font-weight:900;width:100%;margin-top:8px}.primary{background:var(--sky);color:white}.soft{background:var(--pale);color:#278fa7}textarea,input{width:100%;border:1px solid var(--line);border-radius:12px;padding:10px;font:inherit;margin-top:8px}textarea{min-height:80px}nav{position:fixed;z-index:1000;bottom:10px;left:50%;transform:translateX(-50%);width:min(488px,calc(100% - 22px));background:#ffffffed;backdrop-filter:blur(12px);border:1px solid #dceff3;border-radius:21px;display:grid;grid-template-columns:repeat(3,1fr);padding:7px}nav button{border:0;background:none;padding:8px;color:#78949a;font-weight:800;border-radius:13px}nav button.active{background:var(--pale);color:#238fa8}.leaflet-popup-content{font-family:inherit}.pop{font-weight:900}.pop small{display:block;color:#76939b;margin-top:3px}</style></head><body><div class="app"><header><div class="brand">ひなたび<small>HINATA × MIYAZAKI</small></div><button onclick="resetAll()">↻</button></header><main><section id="home" class="screen active"><div class="hero"><h1>宮崎26市町村 ポスター巡り</h1><div class="count"><span id="done">0</span> / 26</div><div id="rate">達成率 0%</div><div class="bar"><div class="fill" id="fill"></div></div></div><div class="section">最近の巡礼</div><div id="recent" class="card">まだ巡礼記録がありません。<br>最初の1枚を撮りに行こう！📸</div><div class="section">26市町村</div><div id="grid" class="grid"></div></section><section id="mapScreen" class="screen"><div class="section">🗺️ 宮崎県 MAP</div><div id="map" class="map"></div><div class="legend"><span class="dot"></span>未訪問　 <span class="dot done"></span>訪問済み　※ピンをタップすると詳細を開けます</div></section><section id="list" class="screen"><div class="section">📍 巡礼リスト</div><div id="listGrid"></div></section><section id="detailScreen" class="screen"><div id="detail"></div></section></main><nav><button data-s="home" onclick="show('home')">🏠<br>ホーム</button><button data-s="mapScreen" onclick="show('mapScreen')">🗺️<br>マップ</button><button data-s="list" onclick="show('list')">📍<br>一覧</button></nav></div><input id="photoInput" type="file" accept="image/*" hidden><script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script><script>const data=[['宮崎市','山下葉留花','宮崎市観光案内所',31.9111,131.4239],['都城市','森本茉莉','道の駅 都城NiQLL（都城市観光協会）',31.7196,131.0616],['延岡市','平岡海月','道の駅 北方よっちみろ屋',32.5823,131.5385],['日南市','鶴崎仁香','日南市観光案内所',31.6026,131.3789],['小林市','小西夏菜実','道の駅ゆ～ぱるのじり',31.9587,130.9913],['日向市','藤嶌果歩','馬ヶ背茶屋・馬ヶ背観光案内所',32.4258,131.6791],['串間市','上村ひなの','都井岬観光交流館PAKALAPAKA',31.3707,131.3358],['西都市','坂井新奈','西都原ガイダンスセンターこのはな館',32.1047,131.4024],['えびの市','大田美月','アウトドアステーションえびの',32.0455,130.8104],['三股町','宮地すみれ','三股町物産館よかもんや',31.7316,131.1241],['高原町','高井俐香','皇子原公園',31.9251,131.0067],['国富町','蔵盛妃那乃','国富町役場',31.9903,131.3226],['綾町','石塚瑶季','綾ほんものセンター',31.9985,131.2586],['高鍋町','正源司陽子','高鍋駅',32.1217,131.5044],['新富町','清水理央','新富町農畜産物直売所 ルーピン',32.0678,131.4868],['西米良村','竹内希来里','川の駅「百菜屋」',32.2262,131.1562],['木城町','金村美玖','木城温泉館「湯らら」',32.1645,131.4697],['川南町','片山紗希','かわみなみPLATZ',32.1871,131.5268],['都農町','髙橋未来虹','都農町役場',32.2575,131.5604],['門川町','大野愛実','門川町観光協会（門川駅内）',32.4701,131.6477],['諸塚村','渡辺莉奈','諸塚村観光協会',32.5097,131.3296],['椎葉村','佐藤優羽','椎葉村観光協会',32.4682,131.1622],['美郷町','松尾桜','春夏秋冬いっつもや',32.4455,131.4237],['高千穂町','下田衣珠季','道の駅高千穂',32.7068,131.3071],['日之影町','平尾帆夏','道の駅 青雲橋',32.6475,131.3915],['五ヶ瀬町','小坂菜緒','五ヶ瀬ワイナリー',32.6769,131.1908]];let state=JSON.parse(localStorage.getItem('hinatabi_miyazaki')||'{}'),current=null,map,markers=[];const esc=s=>String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));function save(){localStorage.setItem('hinatabi_miyazaki',JSON.stringify(state));render()}function show(id){document.querySelectorAll('.screen').forEach(x=>x.classList.remove('active'));document.getElementById(id).classList.add('active');document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('active',b.dataset.s===id));render();scrollTo(0,0)}function render(){let done=data.filter((_,i)=>state[i]?.visited).length;document.getElementById('done').textContent=done;document.getElementById('rate').textContent=done===26?'🎉 ひなたび COMPLETE！':`達成率 ${Math.round(done/26*1000)/10}%`;document.getElementById('fill').style.width=done/26*100+'%';document.getElementById('grid').innerHTML=data.map((m,i)=>`<div class="tile" onclick="openDetail(${i})"><div class="row"><div class="grow"><div class="muni">${m[0]}</div><div class="member">${m[1]}</div></div><span class="badge ${state[i]?.visited?'ok':''}">${state[i]?.visited?'✓ 済':'未訪問'}</span></div><div class="place">📍 ${m[2]}</div></div>`).join('');document.getElementById('listGrid').innerHTML=data.map((m,i)=>`<div class="card" onclick="openDetail(${i})"><div class="row"><div class="grow"><div class="muni">${i+1}. ${m[0]}</div><div class="member">${m[1]}</div><div class="place">📍 ${m[2]}</div></div><span class="badge ${state[i]?.visited?'ok':''}">${state[i]?.visited?'✓ 済':'未訪問'}</span></div></div>`).join('');let recent=Object.keys(state).filter(i=>state[i]?.visited).sort((a,b)=>(state[b].updated||'').localeCompare(state[a].updated||'')).slice(0,3);document.getElementById('recent').innerHTML=recent.length?recent.map(i=>`<div onclick="openDetail(${i})"><b>${data[i][0]}</b>　${state[i].date||''}</div>`).join('<hr>'):'まだ巡礼記録がありません。<br>最初の1枚を撮りに行こう！📸';renderMap()}function initMap(){if(map)return;map=L.map('map').setView([32.25,131.35],8);L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:18,attribution:'&copy; OpenStreetMap contributors'}).addTo(map)}function renderMap(){if(!map)return;markers.forEach(x=>map.removeLayer(x));markers=[];data.forEach((m,i)=>{let color=state[i]?.visited?'#f39a55':'#78d8ef';let icon=L.divIcon({className:'',html:`<div style="width:18px;height:18px;border-radius:50% 50% 50% 0;transform:rotate(-45deg);background:${color};border:3px solid white;box-shadow:0 2px 7px #5558"></div>`,iconSize:[18,18],iconAnchor:[9,18]});let mk=L.marker([m[3],m[4]],{icon}).addTo(map).bindPopup(`<div class="pop">${esc(m[0])}</div><small>${esc(m[1])}</small><small>📍 ${esc(m[2])}</small><br><button onclick="openDetail(${i})">詳細を見る</button>`);markers.push(mk)})}function openDetail(i){current=i;let m=data[i],v=state[i]||{};document.getElementById('detail').innerHTML=`<div class="detail"><button class="back" onclick="show('list')">← 一覧へ</button><div class="muni" style="font-size:24px">${m[0]}</div><div class="member">${m[1]}</div><div class="place">📍 ${m[2]}</div><div class="photo">${v.photo?`<img src="${v.photo}">`:'📸 写真を登録しよう！'}</div><input id="date" type="date" value="${v.date||''}"><textarea id="memo" placeholder="巡礼メモ">${esc(v.memo||'')}</textarea><button class="btn primary" onclick="toggleVisited()">${v.visited?'✓ 訪問済みを解除':'この市町村を訪問済みにする'}</button><button class="btn soft" onclick="pickPhoto()">📸 写真を登録</button></div>`;show('detailScreen')}function toggleVisited(){let v=state[current]=state[current]||{};v.visited=!v.visited;v.date=document.getElementById('date').value;v.memo=document.getElementById('memo').value;v.updated=new Date().toISOString();save()}function pickPhoto(){document.getElementById('photoInput').click()}document.getElementById('photoInput').addEventListener('change',e=>{let f=e.target.files[0];if(!f||current===null)return;let r=new FileReader();r.onload=()=>{let v=state[current]=state[current]||{};v.photo=r.result;v.visited=true;v.date=v.date||new Date().toISOString().slice(0,10);v.updated=new Date().toISOString();save();openDetail(current)};r.readAsDataURL(f)});function resetAll(){if(confirm('巡礼記録をすべて消去しますか？')){state={};save()}}initMap();show('home');</script></body></html>
