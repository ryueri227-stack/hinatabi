<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#78d8ef"><title>ひなたび｜HINATA × MIYAZAKI</title><style>:root{--sky:#78d8ef;--pale:#dff8fd;--ink:#25434b;--muted:#76939b;--line:#e4f1f4;--ok:#35c6a1}*{box-sizing:border-box}body{margin:0;background:linear-gradient(#dff8fd,#f6fcfd 230px);font-family:-apple-system,BlinkMacSystemFont,"Noto Sans JP","Yu Gothic",sans-serif;color:var(--ink)}.app{max-width:520px;margin:auto;min-height:100vh;padding-bottom:90px}header{padding:22px 18px 12px;display:flex;justify-content:space-between;align-items:center}.brand{font-weight:900;font-size:21px}.brand small{display:block;font-size:10px;color:#4d9cac;margin-top:2px}header button{border:0;background:none;font-size:20px;color:#76939b}main{padding:0 15px}.screen{display:none}.screen.active{display:block}.hero{background:linear-gradient(135deg,#8ce2f4,#53c5e1);color:#fff;border-radius:25px;padding:22px;box-shadow:0 12px 30px #53c5e130}.hero h1{margin:0;font-size:18px}.count{font-size:42px;font-weight:900;margin:8px 0}.bar{height:9px;background:#ffffff55;border-radius:99px;overflow:hidden}.fill{height:100%;background:#fff;width:0}.section{font-size:16px;font-weight:900;margin:22px 3px 11px}.card,.tile,.collection,.detail{background:#fff;border:1px solid var(--line);border-radius:18px;padding:14px;margin-bottom:10px}.tile,.collection{cursor:pointer}.row{display:flex;align-items:center;gap:10px}.grow{flex:1}.muni{font-weight:900}.member{font-size:12px;color:var(--muted);margin-top:3px}.place{font-size:11px;color:#4d9cac;margin-top:6px;line-height:1.45}.badge{font-size:10px;font-weight:800;padding:5px 8px;border-radius:99px;background:var(--pale);color:#329bb3;white-space:nowrap}.badge.ok{background:#e4faf4;color:#1a9b79}.select{width:100%;border:1px solid var(--line);background:#fff;border-radius:15px;padding:13px 15px;font:inherit;font-weight:900;color:var(--ink);margin:3px 0 12px}.sub{font-size:11px;color:var(--muted);margin:0 3px 12px}.back{border:0;background:none;color:#329bb3;font-weight:900;padding:0 0 13px}.photo-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:12px 0}.photo-box{position:relative;aspect-ratio:1;border-radius:14px;background:var(--pale);display:grid;place-items:center;overflow:hidden;color:#7aa8b0;font-size:11px;text-align:center}.photo-box img{width:100%;height:100%;object-fit:cover}.delete{position:absolute;right:5px;top:5px;border:0;background:#25434bcc;color:#fff;border-radius:50%;width:25px;height:25px}.btn{border:0;border-radius:13px;padding:12px 14px;font-weight:900;width:100%;margin-top:8px}.primary{background:var(--sky);color:#fff}.soft{background:var(--pale);color:#278fa7}.input{position:absolute;left:-9999px;width:1px;height:1px}.collection-summary{grid-column:1/-1;background:linear-gradient(135deg,#8ce2f4,#53c5e1);color:#fff;border-radius:20px;padding:16px}.collection-summary strong{display:block;font-size:27px;margin-top:3px}.collection-img,.lock{width:100%;aspect-ratio:1;border-radius:13px}.collection-img{object-fit:cover}.lock{background:#f0fbfd;display:grid;place-items:center;font-size:32px}.toast{position:fixed;z-index:3000;left:50%;bottom:86px;transform:translate(-50%,10px);background:#25434b;color:#fff;padding:11px 16px;border-radius:13px;font-size:13px;font-weight:800;opacity:0;pointer-events:none;transition:.2s}.toast.show{opacity:1;transform:translate(-50%,0)}nav{position:fixed;z-index:2000;bottom:10px;left:50%;transform:translateX(-50%);width:min(488px,calc(100% - 22px));background:#ffffffed;backdrop-filter:blur(12px);border:1px solid #dceff3;border-radius:21px;display:grid;grid-template-columns:repeat(4,1fr);padding:7px}nav button{border:0;background:none;padding:8px 2px;color:#78949a;font-weight:800;border-radius:13px;font-size:11px}nav button.active{background:var(--pale);color:#238fa8}</style></head><body><div class="app"><header><div class="brand">ひなたび<small>HINATA × MIYAZAKI</small></div><button onclick="resetAll()">↻</button></header><main><section id="home" class="screen active"><div class="hero"><h1 id="heroTitle">宮崎26市町村 ポスター巡り</h1><div class="count"><span id="done">0</span> / <span id="total">26</span></div><div id="rate">達成率 0%</div><div class="bar"><div id="fill" class="fill"></div></div></div><div class="section">最近の巡礼</div><div id="recent" class="card">まだ巡礼記録がありません。<br>最初の1枚を撮りに行こう！📸</div></section><section id="list" class="screen"><div class="section">📍 巡礼リスト</div><select id="tour" class="select" onchange="setTour(this.value)"><option value="m">🗾 市町村ポスター巡り</option><option value="d">📱 ドコモショップ巡り</option></select><div id="sub" class="sub"></div><div id="listGrid"></div></section><section id="collection" class="screen"><div class="section">📸 ポスターコレクション</div><div id="colGrid" class="grid"></div></section><section id="detailScreen" class="screen"><div id="detail"></div></section></main><nav><button data-s="home" onclick="show('home')">🏠<br>ホーム</button><button data-s="list" onclick="show('list')">📍<br>巡礼</button><button data-s="map" onclick="location.href='map.html'">🗺️<br>マップ</button><button data-s="collection" onclick="show('collection')">📸<br>コレクション</button></nav></div><div id="toast" class="toast"></div><script>
const M=[['宮崎市','山下葉留花','宮崎市観光案内所'],['都城市','森本茉莉','道の駅 都城NiQLL（都城市観光協会）'],['延岡市','平岡海月','道の駅 北方よっちみろ屋'],['日南市','鶴崎仁香','日南市観光案内所'],['小林市','小西夏菜実','道の駅ゆ～ぱるのじり'],['日向市','藤嶌果歩','馬ヶ背茶屋・馬ヶ背観光案内所'],['串間市','上村ひなの','都井岬観光交流館PAKALAPAKA'],['西都市','坂井新奈','西都原ガイダンスセンターこのはな館'],['えびの市','大田美月','アウトドアステーションえびの'],['三股町','宮地すみれ','三股町物産館よかもんや'],['高原町','高井俐香','皇子原公園'],['国富町','蔵盛妃那乃','国富町役場'],['綾町','石塚瑶季','綾ほんものセンター'],['高鍋町','正源司陽子','高鍋駅'],['新富町','清水理央','新富町農畜産物直売所 ルーピン'],['西米良村','竹内希来里','川の駅「百菜屋」'],['木城町','金村美玖','木城温泉館「湯らら」'],['川南町','片山紗希','かわみなみPLATZ'],['都農町','髙橋未来虹','都農町役場'],['門川町','大野愛実','門川町観光協会（門川駅内）'],['諸塚村','渡辺莉奈','諸塚村観光協会'],['椎葉村','佐藤優羽','椎葉村観光協会'],['美郷町','松尾桜','春夏秋冬いっつもや'],['高千穂町','下田衣珠季','道の駅高千穂'],['日之影町','平尾帆夏','道の駅 青雲橋'],['五ヶ瀬町','小坂菜緒','五ヶ瀬ワイナリー']];
const D=['ドコモショップイオンタウン日向店','ドコモショップイオンモール都城駅前店','ドコモショップベアーズモール清武店','ドコモショップフェニックスガーデンうきのじょう店','ドコモショップイオン延岡SC店','ドコモショップ延岡駅前店','ドコモショップ花山手バイパス店','ドコモショップ宮崎大塚店','ドコモショップ宮崎東店','ドコモショップ串間店','ドコモショップ江平店','ドコモショップ佐土原店','ドコモショップ高鍋店','ドコモショップ国富店','ドコモショップ西都店','ドコモショップ小林駅前店','ドコモショップ小林店','ドコモショップ都城吉尾店','ドコモショップ大淀店','ドコモショップ鷹尾店','ドコモショップ日南星倉店','ドコモショップ都城中央店','ドコモショップ日南駅前店','ドコモショップ門川店','ドコモショップ本郷店'];
let ms=JSON.parse(localStorage.getItem('hinatabi_miyazaki')||'{}'),ds=JSON.parse(localStorage.getItem('hinatabi_docomo')||'{}'),tour='m',cur=0,db,urls={};const esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function S(){return tour==='m'?ms:ds}function A(){return tour==='m'?M:D}function K(i){return tour==='m'?String(i):'d'+i}function show(id){document.querySelectorAll('.screen').forEach(x=>x.classList.remove('active'));document.getElementById(id).classList.add('active');document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('active',b.dataset.s===id));render();scrollTo(0,0)}function setTour(t){tour=t;render();}function cnt(i,t=tour){let v=(t==='m'?ms:ds)[i]||{};return Array.isArray(v.photos)?v.photos.length:(v.photo?1:0)}function openDB(){return new Promise((res,rej)=>{let r=indexedDB.open('hinatabi_photos_v2',1);r.onupgradeneeded=()=>r.result.createObjectStore('photos');r.onsuccess=()=>{db=r.result;res()};r.onerror=()=>rej(r.error)})}function get(k){return new Promise(r=>{let q=db.transaction('photos').objectStore('photos').get(k);q.onsuccess=()=>r(q.result||null)})}function put(k,f){return new Promise((res,rej)=>{let q=db.transaction('photos','readwrite');q.objectStore('photos').put(f,k);q.oncomplete=res;q.onerror=()=>rej(q.error)})}function del(k){return new Promise((res,rej)=>{let q=db.transaction('photos','readwrite');q.objectStore('photos').delete(k);q.oncomplete=res;q.onerror=()=>rej(q.error)})}async function load(){for(let t of ['m','d']){let s=t==='m'?ms:ds;for(let i in s){let v=s[i],ks=Array.isArray(v.photos)?v.photos:(v.photo?[t==='m'?String(i):'d'+i]:[]);for(let k of ks){let f=await get(k);if(!f&&t==='m'&&String(k)===String(i))f=await get(Number(i));if(f)urls[k]=URL.createObjectURL(f)}}}render()}function save(){localStorage.setItem('hinatabi_miyazaki',JSON.stringify(ms));localStorage.setItem('hinatabi_docomo',JSON.stringify(ds));render()}function render(){let a=A(),s=S(),done=a.filter((_,i)=>s[i]?.visited).length;document.getElementById('heroTitle').textContent=tour==='m'?'宮崎26市町村 ポスター巡り':'ドコモショップ巡り';document.getElementById('done').textContent=done;document.getElementById('total').textContent=a.length;document.getElementById('rate').textContent=done===a.length?'🎉 COMPLETE！':`達成率 ${Math.round(done/a.length*1000)/10}%`;document.getElementById('fill').style.width=done/a.length*100+'%';document.getElementById('tour').value=tour;document.getElementById('sub').textContent=tour==='m'?`26市町村｜訪問 ${done}市町村`:`25店舗｜訪問 ${done}店舗`;document.getElementById('listGrid').innerHTML=a.map((x,i)=>tour==='m'?`<div class="card" onclick="detail(${i})"><div class="row"><div class="grow"><div class="muni">${i+1}. ${x[0]}</div><div class="member">${x[1]}</div><div class="place">📍 ${x[2]}</div></div><span class="badge ${s[i]?.visited?'ok':''}">${s[i]?.visited?'✓ 済':'未訪問'}</span></div></div>`:`<div class="card" onclick="detail(${i})"><div class="row"><div class="grow"><div class="muni">${i+1}. ${esc(x)}</div></div><span class="badge ${s[i]?.visited?'ok':''}">${s[i]?.visited?'✓ 済':'未訪問'}</span></div></div>`).join('');let recent=Object.keys(s).filter(i=>s[i]?.visited).sort((a,b)=>(s[b].updated||'').localeCompare(s[a].updated||'')).slice(0,3);document.getElementById('recent').innerHTML=recent.length?recent.map(i=>`<div onclick="detail(${i})"><b>${tour==='m'?M[i][0]:D[i]}</b>　${s[i].date||''}</div>`).join('<hr>'):'まだ巡礼記録がありません。<br>最初の1枚を撮りに行こう！📸';document.getElementById('colGrid').innerHTML=`<div class="collection-summary"><div>📸 市町村ポスターコレクション</div><strong>${M.filter((_,i)=>cnt(i,'m')>0).length} / 26</strong></div>`+M.map((x,i)=>{let v=ms[i]||{},ks=Array.isArray(v.photos)?v.photos:(v.photo?[String(i)]:[]),k=ks[0];return `<div class="collection" onclick="tour='m';detail(${i})">${k&&urls[k]?`<img class="collection-img" src="${urls[k]}">`:`<div class="lock">📷</div>`}<div class="muni">${x[0]}</div><div class="member">${x[1]}</div><div class="place">${ks.length?'📸 '+ks.length+'枚登録済み':'未登録'}</div></div>`}).join('')}
async function detail(i){cur=i;show('detailScreen');let s=S(),a=A(),v=s[i]||{},ks=Array.isArray(v.photos)?v.photos:(v.photo?[K(i)]:[]),name=tour==='m'?a[i][0]:a[i],member=tour==='m'?a[i][1]:'ドコモショップ',place=tour==='m'?a[i][2]:'ドコモショップ巡り';document.getElementById('detail').innerHTML=`<button class="back" onclick="show('list')">← 巡礼リストに戻る</button><div class="detail"><div class="muni">${esc(name)}</div><div class="member">${esc(member)}</div><div class="place">📍 ${esc(place)}</div><div class="photo-grid" id="pg"></div><input id="inp" class="input" type="file" accept="image/*" multiple><button class="btn primary" id="add">📸 写真を追加</button><button class="btn soft" onclick="visit()">${v.visited?'✓ 訪問済み':'訪問済みにする'}</button></div>`;document.getElementById('add').onclick=()=>document.getElementById('inp').click();document.getElementById('inp').onchange=e=>photos(e.target.files);paint(ks)}async function paint(ks){let p=document.getElementById('pg');if(!p)return;p.innerHTML=ks.map((k,n)=>urls[k]?`<div class="photo-box"><img src="${urls[k]}"><span>${n+1}</span><button class="delete" onclick="event.stopPropagation();remove('${k}')">×</button></div>`:'').join('')||'<div class="photo-box">📷 最大3枚</div>'}async function photos(files){let s=S(),v=s[cur]||(s[cur]={}),ks=Array.isArray(v.photos)?v.photos.slice():(v.photo?[K(cur)]:[]);if(ks.length>=3){toast('写真は最大3枚までです');return}for(let f of Array.from(files).slice(0,3-ks.length)){let k=ks.length?K(cur)+'_'+Date.now()+'_'+Math.random().toString(36).slice(2,6):K(cur);await put(k,f);urls[k]=URL.createObjectURL(f);ks.push(k)}v.photos=ks;delete v.photo;v.visited=true;v.date=v.date||new Date().toLocaleDateString('ja-JP');v.updated=new Date().toISOString();save();paint(ks);toast(`${ks.length}枚登録済みです📸`)}async function remove(k){await del(k);delete urls[k];let s=S(),v=s[cur]||{};v.photos=(v.photos||[]).filter(x=>x!==k);save();paint(v.photos);toast('写真を削除しました')}function visit(){let s=S(),v=s[cur]||(s[cur]={});v.visited=true;v.date=new Date().toLocaleDateString('ja-JP');v.updated=new Date().toISOString();save();toast('訪問済みにしました！')}function toast(x){let t=document.getElementById('toast');t.textContent=x;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),1800)}function resetAll(){if(!confirm('巡礼記録をすべてリセットしますか？'))return;ms={};ds={};save();toast('リセットしました')}openDB().then(load).catch(()=>render());</script></body></html>
