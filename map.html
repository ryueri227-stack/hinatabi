<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#78d8ef">
<title>ひなたび｜宮崎26市町村マップ</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
:root{--sky:#78d8ef;--pale:#dff8fd;--ink:#25434b;--muted:#76939b;--line:#e4f1f4;--ok:#35c6a1}
*{box-sizing:border-box}body{margin:0;background:linear-gradient(#dff8fd,#f6fcfd 220px);font-family:-apple-system,BlinkMacSystemFont,"Noto Sans JP","Yu Gothic",sans-serif;color:var(--ink)}
.app{max-width:520px;margin:auto;min-height:100vh;padding-bottom:100px}header{padding:22px 18px 12px;display:flex;align-items:center;gap:12px}.back{border:0;background:none;color:#238fa8;font-size:20px;font-weight:900}.brand{font-weight:900;font-size:21px}.brand small{display:block;font-size:10px;color:#4d9cac;margin-top:2px}.title{padding:0 15px 10px;font-weight:900;font-size:18px}.sub{padding:0 15px 10px;color:var(--muted);font-size:12px}
#map{height:calc(100vh - 180px);min-height:520px;margin:0 10px;border-radius:22px;border:1px solid var(--line);overflow:hidden;box-shadow:0 10px 28px #53c5e120}.leaflet-container{font-family:inherit;background:#eefbfd}.muni-label{background:#ffffffed;border:1px solid #cfeaf0;border-radius:10px;box-shadow:0 2px 8px #25434b20;color:var(--ink);font-size:10px;font-weight:900;padding:3px 6px}.leaflet-tooltip.muni-label:before{display:none}
.panel{position:fixed;z-index:2000;left:50%;bottom:12px;transform:translateX(-50%) translateY(120%);width:min(500px,calc(100% - 28px));background:#fff;border:1px solid var(--line);border-radius:20px;padding:15px;box-shadow:0 15px 40px #25434b30;transition:.25s}.panel.show{transform:translateX(-50%) translateY(0)}.row{display:flex;align-items:center;gap:10px}.grow{flex:1}.muni{font-size:18px;font-weight:900}.member{font-size:12px;color:var(--muted);margin-top:3px}.place{font-size:11px;color:#4d9cac;margin-top:6px;line-height:1.45}.badge{font-size:10px;font-weight:800;padding:5px 8px;border-radius:99px;background:var(--pale);color:#329bb3;white-space:nowrap}.badge.ok{background:#e4faf4;color:#1a9b79}.btn{display:block;border:0;border-radius:13px;padding:12px 14px;font-weight:900;width:100%;margin-top:10px;text-align:center;text-decoration:none}.primary{background:var(--sky);color:#fff}.soft{background:var(--pale);color:#278fa7}.legend{display:flex;gap:8px;align-items:center;padding:9px 15px 0;font-size:10px;color:var(--muted)}.dot{width:12px;height:12px;border-radius:4px;background:#cfeff5;border:1px solid #86cbd7}.dot.ok{background:#b9f0df;border-color:#54c9a8}
</style>
</head>
<body>
<div class="app">
<header><a class="back" href="index.html" aria-label="戻る">←</a><div class="brand">ひなたび<small>HINATA × MIYAZAKI</small></div></header>
<div class="title">🗺️ 宮崎26市町村マップ</div>
<div class="sub">市町村のエリアをタップすると、ポスター情報と写真登録を確認できます。</div>
<div id="map"></div>
<div class="legend"><span class="dot"></span>未訪問 <span class="dot ok"></span>訪問済み</div>
</div>
<div id="panel" class="panel"></div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
const data=[
['宮崎市','山下葉留花','宮崎市観光案内所','45201'],['都城市','森本茉莉','道の駅 都城NiQLL（都城市観光協会）','45202'],['延岡市','平岡海月','道の駅 北方よっちみろ屋','45203'],['日南市','鶴崎仁香','日南市観光案内所','45204'],['小林市','小西夏菜実','道の駅ゆ～ぱるのじり','45205'],['日向市','藤嶌果歩','馬ヶ背茶屋・馬ヶ背観光案内所','45206'],['串間市','上村ひなの','都井岬観光交流館PAKALAPAKA','45207'],['西都市','坂井新奈','西都原ガイダンスセンターこのはな館','45208'],['えびの市','大田美月','アウトドアステーションえびの','45209'],['三股町','宮地すみれ','三股町物産館よかもんや','45341'],['高原町','高井俐香','皇子原公園','45361'],['国富町','蔵盛妃那乃','国富町役場','45382'],['綾町','石塚瑶季','綾ほんものセンター','45383'],['高鍋町','正源司陽子','高鍋駅','45401'],['新富町','清水理央','新富町農畜産物直売所 ルーピン','45402'],['西米良村','竹内希来里','川の駅「百菜屋」','45403'],['木城町','金村美玖','木城温泉館「湯らら」','45404'],['川南町','片山紗希','かわみなみPLATZ','45405'],['都農町','髙橋未来虹','都農町役場','45406'],['門川町','大野愛実','門川町観光協会（門川駅内）','45421'],['諸塚村','渡辺莉奈','諸塚村観光協会','45429'],['椎葉村','佐藤優羽','椎葉村観光協会','45430'],['美郷町','松尾桜','春夏秋冬いっつもや','45431'],['高千穂町','下田衣珠季','道の駅高千穂','45441'],['日之影町','平尾帆夏','道の駅 青雲橋','45442'],['五ヶ瀬町','小坂菜緒','五ヶ瀬ワイナリー','45443']
];
const state=JSON.parse(localStorage.getItem('hinatabi_miyazaki')||'{}');
const map=L.map('map',{zoomControl:true,attributionControl:true}).setView([32.3,131.3],8);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:18,attribution:'© OpenStreetMap contributors'}).addTo(map);
const bounds=[];
function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function showPanel(i){const m=data[i],v=state[i]||{};document.getElementById('panel').innerHTML=`<div class="row"><div class="grow"><div class="muni">${esc(m[0])}</div><div class="member">👤 ${esc(m[1])}</div></div><span class="badge ${v.visited?'ok':''}">${v.visited?'✓ 訪問済み':'未訪問'}</span></div><div class="place">📍 ${esc(m[2])}</div><a class="btn primary" href="index.html#municipality-${i}" onclick="localStorage.setItem('hinatabi_open_index',String(${i}))">📸 写真を登録する</a><a class="btn soft" href="index.html">ひなたびの巡礼画面を開く</a>`;document.getElementById('panel').classList.add('show')}
async function load(){const layers=[];for(let i=0;i<data.length;i++){const m=data[i];try{const r=await fetch(`https://shikuchoson-boundaries.sankichi.app/${m[3]}.geojson`);if(!r.ok)throw new Error('boundary');const gj=await r.json();const done=!!state[i]?.visited;const layer=L.geoJSON(gj,{style:{color:done?'#35a987':'#62b7c8',weight:1.5,fillColor:done?'#b9f0df':'#cfeff5',fillOpacity:.78},onEachFeature:(feature,l)=>{l.bindTooltip(m[0],{permanent:true,direction:'center',className:'muni-label',opacity:.92});l.on({click:()=>showPanel(i),mouseover:e=>e.target.setStyle({weight:2.5,fillOpacity:.9}),mouseout:e=>e.target.setStyle({weight:1.5,fillOpacity:.78})})}}).addTo(map);layers.push(layer);const b=layer.getBounds();if(b.isValid())bounds.push(b)}catch(e){console.warn('境界取得失敗',m[0],e)}}if(bounds.length){let b=bounds[0];for(let i=1;i<bounds.length;i++)b=b.extend(bounds[i]);map.fitBounds(b.pad(.03))}}
map.on('click',()=>document.getElementById('panel').classList.remove('show'));
load();
</script>
</body>
</html>
