name: Fix Hinatabi
on:
  push:
    paths:
      - '.github/workflows/hinatabi-fix.yml'
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply fixes
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          s2 = s.replace('accept="image/*" capture="environment"', 'accept="image/*"')
          s2 = s2.replace("<div class=\"collection-lock\">🔒</div>", "<div class=\"collection-lock\">📷</div>")
          s2 = s2.replace("${v.photo?m[1]:'？？？'}", "${m[1]}")
          s2 = s2.replace("${v.photo?'📸 発見済み':'まだ未発見'}", "${v.photo?'📸 発見済み':'📷 まだ撮影していません'}")
          if s2 == s:
              print('No changes needed')
          else:
              p.write_text(s2, encoding='utf-8')
          PY
      - name: Commit fixes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet || git commit -m 'Fix photo library selection and collection display'
          git push
