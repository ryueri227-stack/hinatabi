name: Fix photo registration display
on:
  push:
    paths:
      - '.github/workflows/photo-fix.yml'
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix photo storage compatibility
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          old="async function load(){for(let t of ['m','d']){let s=t==='m'?ms:ds;for(let i in s){let v=s[i],ks=Array.isArray(v.photos)?v.photos:(v.photo?[t==='m'?String(i):'d'+i]:[]);for(let k of ks){let f=await get(k);if(f)urls[k]=URL.createObjectURL(f)}}}render()}"
          new="async function load(){for(let t of ['m','d']){let s=t==='m'?ms:ds;for(let i in s){let v=s[i],ks=Array.isArray(v.photos)?v.photos:(v.photo?[t==='m'?String(i):'d'+i]:[]);for(let k of ks){let f=await get(k);if(!f&&t==='m'&&String(k)===String(i))f=await get(Number(i));if(f)urls[k]=URL.createObjectURL(f)}}}render()}"
          if old not in s:
              raise SystemExit('target load function not found')
          p.write_text(s.replace(old,new,1),encoding='utf-8')
          PY
      - name: Commit fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet || git commit -m 'Fix legacy photo key compatibility'
          git push